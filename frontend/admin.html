<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Demo — Comenzi</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin-page">
    <header class="restaurant-header">
        <div class="restaurant-header-inner">
            <div class="restaurant-brand">
                <span class="restaurant-logo" aria-hidden="true">R</span>
                <div>
                    <h1>Restaurant Demo</h1>
                    <p class="brand-credit">Powered by <strong>SwiftOrder</strong></p>
                </div>
            </div>
            <span id="staff-info" class="staff-label">Personal</span>
            <button id="logout-button" type="button">Deconectare</button>
        </div>
    </header>

    <main>
        <nav id="staff-navigation" class="orders-tabs" hidden>
             <button id="show-orders" type="button" class="selected"
                    aria-pressed="true">
                         Comenzi
             </button>
             <button id="show-menu-management" type="button"
                   aria-pressed="false">
                    Gestionare meniu
             </button>
        </nav>
        <section id="orders-section" class="admin-section">
            <div class="admin-heading">
                <div>
                    <h2>Comenzi</h2>
                    <p>De la prima comandă până la ultima masă servită.</p>
                </div>
                <p id="refresh-status">Se conectează...</p>
            </div>
            <div class="order-overview" aria-label="Rezumat comenzi active">
                <div class="overview-item overview-new"><span>Noi</span><strong id="new-count">—</strong></div>
                <div class="overview-item overview-preparing"><span>În preparare</span><strong id="preparing-count">—</strong></div>
            </div>
            <div class="orders-tabs">
                <button id="show-active" type="button">Comenzi active <span id="active-count">—</span></button>
                <button id="show-history" type="button">Istoric</button>
            </div>
            <div id="orders">
                <p>Se încarcă comenzile...</p>
            </div>
            <p id="history-count" hidden></p>
            <button id="load-more-history" type="button" hidden>
                Încarcă mai multe
            </button>
        </section>
        <section id="menu-management-section" class="admin-section" hidden>
            <div class="admin-heading">
                <h2>Gestionare meniu</h2>
                <button id="add-product" type="button">Adaugă produs</button>
            </div>
            <p id="menu-message" role="status" hidden></p>
             <div id="managed-products"></div>
        </section>
    </main>

    <dialog id="product-editor" aria-labelledby="product-editor-title">
        <form id="product-form">
            <h2 id="product-editor-title">Adaugă produs</h2>
            <p id="product-delete-warning" hidden></p>
            <fieldset id="product-fields">
                <label for="product-name">Nume</label>
                <input id="product-name" type="text" maxlength="120" required>
                <label for="product-category">Categorie</label>
                <select id="product-category" required>
                    <option value="Altele">Altele</option>
                </select>
                <label for="product-price">Preț (lei)</label>
                <input id="product-price" type="number" inputmode="decimal" min="0" step="0.01" required>
                <label class="availability-field" for="product-available">
                    <input id="product-available" type="checkbox"> Disponibil în meniu
                </label>
            </fieldset>
            <p id="product-form-message" role="status" hidden></p>
            <div class="product-editor-actions">
                <button id="cancel-product" class="secondary-action" type="button">Anulează</button>
                <button id="save-product" type="submit">Salvează</button>
            </div>
        </form>
    </dialog>
    <script src="/static/admin.js"></script>
</body>
</html>
