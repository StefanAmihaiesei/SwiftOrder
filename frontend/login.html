<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftOrder — Autentificare</title>
    <link rel="stylesheet" href="/static/style.css?v=bistro-2">
</head>
<body class="login-page">
    <main class="login-layout">
        <div class="login-welcome">
            <div class="restaurant-brand">
                <span class="restaurant-logo" aria-hidden="true">R</span>
                <div><h1>Restaurant Demo</h1><p class="brand-credit">Powered by <strong>SwiftOrder</strong></p></div>
            </div>
            <div class="login-greeting">
                <p class="eyebrow">Spațiul personalului</p>
                <h2>Bun venit<br><em>în tură.</em></h2>
                <p>Meniul, mesele și comenzile.<br>Toate la locul lor.</p>
            </div>
            <a class="back-to-menu" href="/menu">Înapoi la meniu <span aria-hidden="true">↗</span></a>
        </div>
        <section class="login-panel" aria-labelledby="login-title">
            <p class="eyebrow">Acces personal</p>
            <h2 id="login-title">Intră în cont</h2>
            <p class="login-intro">Folosește datele contului tău de personal.</p>

            <form id="login-form" method="post" action="/auth/login">
                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                >

                <label for="password">Parolă</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">Intră în cont</button>
                <p id="login-message" role="status"></p>
            </form>
        </section>
    </main>
    <script src="/static/brand.js"></script>
    <script src="/static/login.js"></script>
</body>
</html>
